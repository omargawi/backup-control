name: Backup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Verification mode
        required: true
        type: choice
        options:
          - synthetic
          - production

permissions:
  contents: read

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  synthetic:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'synthetic' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-backup
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      BACKUP_BLOB_PREFIX: synthetic/${{ github.run_id }}-${{ github.run_attempt }}/
      BACKUP_MODE: synthetic
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.8.0'
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.6'
          cache: false
      - name: Install dependencies and pinned age
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/age-bin
        run: |
          npm ci --ignore-scripts
          go install filippo.io/age/cmd/age@482cf6fc9babd3ab06f6606762aac10447222201
          go install filippo.io/age/cmd/age-keygen@482cf6fc9babd3ab06f6606762aac10447222201
          echo "$GOBIN" >> "$GITHUB_PATH"
          "$GOBIN/age" --version | grep -F 'v1.2.1'
      - name: Create ephemeral synthetic recovery identity
        id: identity
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/age-bin
        run: |
          identity="$RUNNER_TEMP/synthetic-age-identity.txt"
          "$GOBIN/age-keygen" --output "$identity" 2> "$RUNNER_TEMP/age-keygen.log"
          recipient="$("$GOBIN/age-keygen" -y "$identity")"
          echo "BACKUP_AGE_RECIPIENT=$recipient" >> "$GITHUB_ENV"
          echo "SYNTHETIC_AGE_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Create synthetic ciphertext
        id: backup
        shell: bash
        run: bash scripts/create-encrypted-logical-backup.sh
      - name: Upload and verify private ciphertext
        id: store
        shell: bash
        run: |
          downloaded="$RUNNER_TEMP/synthetic-ciphertext.age"
          pathname="$(node scripts/blob-control.mjs store '${{ steps.backup.outputs.encrypted_path }}' "$downloaded")"
          echo "pathname=$pathname" >> "$GITHUB_OUTPUT"
      - name: Decrypt and verify downloaded synthetic backup
        shell: bash
        run: |
          verification_dir="$RUNNER_TEMP/synthetic-verification"
          archive="$verification_dir/logical-backup.tar.gz"
          extracted="$verification_dir/extracted"
          mkdir -m 700 -p "$extracted"

          age --decrypt \
            --identity "$SYNTHETIC_AGE_IDENTITY" \
            --output "$archive" \
            "$RUNNER_TEMP/synthetic-ciphertext.age"

          expected_members="$(printf '%s\n' SHA256SUMS data.sql manifest.json schema.sql)"
          actual_members="$(tar -tzf "$archive" | LC_ALL=C sort)"
          if [[ "$actual_members" != "$expected_members" ]]; then
            echo 'Decrypted archive contains an unexpected member set.' >&2
            exit 1
          fi

          tar --extract --gzip --file "$archive" --directory "$extracted" \
            --no-same-owner --no-same-permissions
          (
            cd "$extracted"
            sha256sum --check --strict SHA256SUMS
            printf '%s\n' 'CREATE TABLE public.synthetic_backup_probe (id integer);' | cmp - schema.sql
            printf '%s\n' 'COPY public.synthetic_backup_probe (id) FROM stdin;' '1' '\\.' | cmp - data.sql
            jq -e --arg source_ref "$GITHUB_SHA" '
              .format_version == 1 and
              .source_ref == $source_ref and
              .mode == "synthetic" and
              .dump_tool == "synthetic" and
              .schema_and_data == ["public"] and
              .schema_only == ["private"] and
              (.created_at | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
            ' manifest.json > /dev/null
          )
          echo 'Synthetic decryption and content verification passed.'
      - name: Delete synthetic ciphertext
        if: always() && steps.store.outputs.pathname != ''
        shell: bash
        run: node scripts/blob-control.mjs delete '${{ steps.store.outputs.pathname }}'
      - name: Remove ephemeral synthetic verification files
        if: always()
        shell: bash
        run: |
          rm -f -- \
            "$RUNNER_TEMP/synthetic-age-identity.txt" \
            "$RUNNER_TEMP/age-keygen.log" \
            "$RUNNER_TEMP/synthetic-ciphertext.age"
          rm -rf -- "$RUNNER_TEMP/synthetic-verification"

  production:
    if: (github.event_name == 'schedule' || inputs.mode == 'production') && github.ref == 'refs/heads/main' && vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-backup
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
      BACKUP_SCHEMA_AND_DATA: ${{ vars.BACKUP_SCHEMA_AND_DATA }}
      BACKUP_SCHEMA_ONLY: ${{ vars.BACKUP_SCHEMA_ONLY }}
      BACKUP_BLOB_PREFIX: ${{ vars.BACKUP_NAMESPACE }}/
      BACKUP_PGDUMP_IMAGE: postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
      BACKUP_MODE: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.8.0'
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.6'
          cache: false
      - name: Install controller dependencies
        shell: bash
        run: npm ci --ignore-scripts
      - name: Verify pinned PostgreSQL client
        shell: bash
        run: |
          docker pull "$BACKUP_PGDUMP_IMAGE"
          docker run --rm --entrypoint pg_dump "$BACKUP_PGDUMP_IMAGE" --version | grep -F '17.6'
      - name: Install pinned age
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/age-bin
        run: |
          go install filippo.io/age/cmd/age@482cf6fc9babd3ab06f6606762aac10447222201
          echo "$GOBIN" >> "$GITHUB_PATH"
          "$GOBIN/age" --version | grep -F 'v1.2.1'
      - name: Create encrypted logical backup
        id: backup
        shell: bash
        run: bash scripts/create-encrypted-logical-backup.sh
      - name: Store and verify private ciphertext
        shell: bash
        run: node scripts/blob-control.mjs store '${{ steps.backup.outputs.encrypted_path }}'
